<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="../css/style.css" />
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <div class="cash">
   <div class="box">
    <h1 id="title">Sign Up as a vendor</h1>
    <form id="signupForm">
      <div class="input-group">
        <div class="input-field" id="nameFeild">
         <i class="fa-solid fa-user"></i>
         <input type="text" id="username" placeholder="Username">
        </div>
        <div class="input-field">
        <i class="fa-solid fa-at"></i>
         <input type="email" id="email" placeholder="Email">
      </div>
      <div class="input-field">
        <i class="fa-solid fa-shop"></i>
         <input type="shop" id="shop" placeholder=" Shop Name">
      </div>
      <div class="input-field">
        <i class="fa-solid fa-phone"></i>
         <input type="number" id="phone" placeholder="Phone Number">
      </div>
      
      <div class="input-field">
        <i class="fa-solid fa-city"></i>
         <input type="City" id="city" placeholder="City">
      </div>
      <div class="input-field">
        <i class="fa-solid fa-lock"></i>
         <input type="password" id="password" placeholder="Password">
      </div>
        <div class="btn-feild">
        <a href="#"> Forgot Password</a>
        <button type="submit" class="btn btn-primary">Sign up</button>
      </div>
        <h7>Already have an account?</h3>
            <a href="login.html">
        <button type="button" class=" btn btn-secondary">login</button>
        </a>
       </div>
      </div>
    </form>
    </div>
  </div>
  <script src="../js/vendorin.js"></script>
</body>
</html>

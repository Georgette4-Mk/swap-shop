<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swap Shop | Order Confirmation</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="responsive.css">
<link rel="stylesheet" href="confirmation.css">
</head>
<body>
<header class="navbar">
<div class="logo">
Swap Shop
<span>Buy. Sell. Connect.</span>
</div>
</header>
<section class="confirmation">
<div class="success-icon">✓</div>
<h1>Order Placed Successfully!</h1>
<p>
Thank you for shopping with Swap Shop.
Your order has been received successfully.
</p>
<div class="order-details" id="orderDetails"></div>
<div class="actions">
<a href="browse.html">Continue Shopping</a>
<a href="index.html">Dashboard</a>
</div>
</section>
<script>
const customer=
JSON.parse(localStorage.getItem("customerOrder"));
const orderNo="SS-"+Math.floor(Math.random()*1000000);
const details=document.getElementById("orderDetails");
if(customer){
details.innerHTML=`
<p><strong>Order Number:</strong> ${orderNo}</p>
<p><strong>Name:</strong> ${customer.name}</p>
<p><strong>Email:</strong> ${customer.email}</p>
<p><strong>Phone:</strong> ${customer.phone}</p>
<p><strong>Address:</strong> ${customer.address}</p>
<p><strong>City:</strong> ${customer.city}</p>
<p><strong>Region:</strong> ${customer.region}</p>
<p><strong>Payment:</strong> ${customer.payment}</p>
`;
localStorage.removeItem("customerOrder");
}else{
details.innerHTML="<p>No recent order found.</p>";
}
</script>
</body>
</html>

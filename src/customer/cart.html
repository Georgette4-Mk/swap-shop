<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Swap Shop | Shopping Cart</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="cart.css">

</head>
<body>
<header class="navbar">
<div class="logo">
Swap Shop
<span>Buy. Sell. Connect.</span>
</div>
<button class="menu-toggle" id="menuToggle">☰</button>
<nav class="nav-links">
<a href="../Customer/index.html">Dashboard</a>
<a href="../Customer/browse.html">Browse</a>
<a href="cart.html">Cart <span id="cartCount" class="cart-count">0</span></a>

<main class="cart-page">
<h1>Shopping Cart</h1>
<div class="cart-layout">

<section class="cart-summary">

<h2>Cart Summary</h2>

<p>
Items:<span id="totalItems">0</span></p>
<p>Subtotal:FCFA<span id="subtotal">0</span></p>
<p>Delivery:FCFA<span id="delivery">2000</span></p>
<hr>
<h3>Total:FCFA<span id="grandTotal">0</span></h3>
<button onclick="checkoutPage()">Proceed To Checkout</button>
<button class="empty-btn" onclick="emptyCart()">Empty Cart</button>
</section>
</div>
</main>

<script src="../Customer/app.js"></script>
<script src="../Customer/storage.js"></script>
